<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Live Geo Location on Mapbox Globe</title>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 24px;
            background-color: rgba(255, 255, 255, 0.8);
        }
    </style>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.10.0/mapbox-gl.js'></script>
</head>

<body>

    <div id="map"></div>
    <div id="loading" class="loading">Loading...</div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoidW5pdmVyc2l0eS1vZi1jZW50cmFsLXB1bmphYiIsImEiOiJjbTFvcmdnOG4wa3puMmlzZjk3eXZ0MTV6In0.L1iyBcvvQon1-1z-0v1hPw'; // Add your Mapbox access token here

        let map;
        let marker;
        let ws;
        let reconnectInterval;
        const latitude = 31.4469;
        const longitude = 74.2682;

        function initMap() {
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/satellite-v9', // Change style for globe rendering
                center: [longitude, latitude],
                zoom: 3, // Start with a lower zoom for globe view
                projection: 'globe' // Enable globe projection
            });

            map.on('load', () => {
                document.getElementById('loading').style.display = 'none';

                // Set the atmosphere and fog to enhance the globe view
                map.setFog({}); // Default atmosphere style
            });

            marker = new mapboxgl.Marker()
                .setLngLat([longitude, latitude])
                .addTo(map);

            map.flyTo({
                center: [longitude, latitude],
                zoom: 17,
                bearing: 180,
                pitch: 30,
                duration: 4000
            });

            map.on('click', onMapClick);
            map.on('move', () => {
                console.log('Map is being interacted with');
            });

            // Connect to WebSocket for real-time updates
            connectWebSocket();
        }

        function connectWebSocket() {
            try {
                console.log('Connecting to WebSocket: ws://localhost:8765/telemetry');
                ws = new WebSocket('ws://localhost:8765/telemetry');

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    if (reconnectInterval) {
                        clearTimeout(reconnectInterval);
                        reconnectInterval = null;
                    }
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        updateLocation(data);
                    } catch (error) {
                        console.error('Error parsing WebSocket message:', error);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };

                ws.onclose = () => {
                    console.log('WebSocket disconnected. Attempting to reconnect in 3 seconds...');
                    reconnectInterval = setTimeout(connectWebSocket, 3000);
                };
            } catch (error) {
                console.error('Failed to connect to WebSocket:', error);
                reconnectInterval = setTimeout(connectWebSocket, 3000);
            }
        }

        function updateLocation(data) {
            try {
                // Support both flat format (WebSocket) and nested format (old API)
                let newLat, newLng;
                
                if (data.lat !== undefined && data.lon !== undefined) {
                    // Flat format from WebSocket
                    newLat = data.lat || latitude;
                    newLng = data.lon || longitude;
                } else if (data.GPS) {
                    // Nested format
                    newLat = data.GPS.latitude || latitude;
                    newLng = data.GPS.longitude || longitude;
                } else {
                    return; // No GPS data
                }

                marker.setLngLat([newLng, newLat]);
                console.log(`Updated coordinates: Lat: ${newLat}, Lng: ${newLng}`);
            } catch (error) {
                console.error('Error updating location:', error);
            }
        }

        function onMapClick(e) {
            const coordinates = e.lngLat;
            alert(`Coordinates:\nLng: ${coordinates.lng}, Lat: ${coordinates.lat}`);
        }

        window.onload = initMap;
    </script>
</body>

</html>
